<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | The Odin Project</title>
    <link rel="stylesheet" href="./styles/style.css">
    <script src="./scripts/main.js"></script>
</head>
<body>
    <h1>Calculator</h1>
    <div class="calculator">
        <div class="display">OUTPUT GOES HERE</div>
        <div class="row">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>+</button>
        </div>
        <div class="row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
        </div>
        <div class="row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>*</button>
        </div>
        <div class="row">
            <button>0</button>
            <button>.</button>
            <button>AC</button>
            <button>/</button>
        </div>
    </div>
</body>
</html>
